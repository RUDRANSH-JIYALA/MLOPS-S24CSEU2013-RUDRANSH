name: MLOps Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib pyyaml pytest

      - name: Train P04 model
        working-directory: Practicals/P04-from-notebook-to-package
        run: |
          python work/train.py

      - name: Run P05 tests
        working-directory: Practicals/P05-settings-and-testing
        run: |
          python -m pytest work -v
